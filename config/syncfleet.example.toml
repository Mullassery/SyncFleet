# SyncFleet Configuration
# All values below are documented defaults. Uncomment and set only what you
# need to override. Copy to one of:
#   ~/.config/syncfleet/config.toml
#   /etc/syncfleet/config.toml
# or pass with `syncfleet --config <path>`.
#
# Environment overrides use the SYNCFLEET_ prefix with a double-underscore
# path separator, e.g. SYNCFLEET_NODE__DATA_DIR or SYNCFLEET_NETWORK__LISTEN_ADDR.

# [node]
# node_name = "syncfleet-node"
# data_dir = "~/.local/share/syncfleet"
# log_level = "info"          # trace, debug, info, warn, error
# log_format = "text"         # text, json

# [network]
# listen_addr = "0.0.0.0:8443"
# advertise_addr = "auto"
# tls_cert = "~/.config/syncfleet/certs/node.pem"
# tls_key = "~/.config/syncfleet/certs/node-key.pem"
# ca_cert = "~/.config/syncfleet/certs/ca.pem"
# min_tls_version = "1.3"     # 1.2 or 1.3
# connect_timeout_sec = 30
# idle_timeout_sec = 300
# max_message_size = 1048576

# [discovery]
# enabled = false
# port = 5353
# service_name = "_syncfleet._tcp"
# ttl_sec = 120

# [storage]
# journal_retention_days = 30
# journal_max_size_gb = 1
# snapshot_interval_hours = 24
# compaction_interval_hours = 6
# wal_mode = true
# busy_timeout_ms = 5000
# integrity_check_on_startup = true

# [replication]
# max_concurrent_peers = 32
# max_in_flight = 32
# max_ops_per_response = 1000
# sync_interval_sec = 30
# initial_sync_timeout_sec = 60
# snapshot_bootstrap_enabled = true
# max_snapshot_size_mb = 500

# [security]
# enrollment_token_expiry_hours = 24
# require_enrollment_token = true
# peer_cert_validity_days = 90
# auto_renew_peer_certs = true
# renewal_window_days = 14

# [metrics]
# enabled = true
# listen_addr = "127.0.0.1:9090"
# path = "/metrics"
# histograms_enabled = true

# [daemon]
# background = false
# pid_file = "~/.local/share/syncfleet/syncfleet.pid"
# shutdown_timeout_sec = 30
