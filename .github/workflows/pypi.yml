name: Publish to PyPI

# Publishes the Python wrapper to PyPI whenever a version tag (vX.Y.Z) is
# pushed, or manually via workflow_dispatch. Platform wheels bundle the native
# `syncfleet` executable built for that OS/arch, so `pip install syncfleet`
# installs a working wrapper with no extra steps.
#
# Publishing uses a PyPI API token stored as the `PYPI_API_TOKEN` repository
# secret (Settings -> Secrets and variables -> Actions). To use Trusted
# Publishing (OIDC) instead, remove the `with: password:` block below and
# configure the publisher on PyPI for this repository/workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plat: manylinux_2_35_x86_64
          - os: macos-15-intel
            plat: macosx_11_0_x86_64
          - os: macos-14
            plat: macosx_11_0_arm64
          - os: windows-latest
            plat: win_amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native binary and vendor it
        run: python scripts/build_vendor.py --no-wheel
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel -C--build-option=--plat-name=${{ matrix.plat }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.plat }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -R dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
