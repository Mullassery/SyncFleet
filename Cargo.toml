[package]
name = "syncfleet"
version = "0.7.0"
edition = "2021"
rust-version = "1.89"
description = "A secure, local-first, peer-to-peer edge database synchronization engine"
license = "MIT"
repository = "https://github.com/Mullassery/SyncFleet"
readme = "README.md"
keywords = ["sync", "p2p", "edge", "sqlite", "replication", "iot"]
categories = ["command-line-utilities", "database", "network-programming"]

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "env"] }

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.38", features = ["full", "tracing"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Cryptography
ed25519-dalek = { version = "2", features = ["pkcs8"] }
rand = { version = "0.8", features = ["std"] }
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom", "zeroize"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.12", features = ["pem"] }
pem = "1.0"
x509-parser = "0.17"

# UUID
uuid = { version = "1.7", features = ["v7", "serde", "v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["std"] }

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.13"

# mDNS (optional, feature-gated)
mdns-sd = { version = "0.11", optional = true }

# SQLite
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }

# Serialization
bincode = "1.3"
hex = "0.4"
typenum = "1.17"

# Signal handling (included in tokio)

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["mdns"]
mdns = ["mdns-sd"]

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.4"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
rand = "0.8"
uuid = { version = "1.7", features = ["v7"] }

[[bin]]
name = "syncfleet"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true

[workspace]
members = []