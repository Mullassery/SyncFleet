<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 11 symbols across 3 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "cli", "label": "cli", "description": "Owns 48 symbols across 1 file(s)."}}, {"data": {"id": "config", "label": "config", "description": "Owns 27 symbols across 1 file(s)."}}, {"data": {"id": "discovery", "label": "discovery", "description": "Owns 9 symbols across 1 file(s)."}}, {"data": {"id": "error", "label": "error", "description": "Owns 8 symbols across 1 file(s)."}}, {"data": {"id": "identity", "label": "identity", "description": "Owns 25 symbols across 1 file(s)."}}, {"data": {"id": "net", "label": "net", "description": "Owns 18 symbols across 1 file(s)."}}, {"data": {"id": "replication", "label": "replication", "description": "Owns 13 symbols across 1 file(s)."}}, {"data": {"id": "storage", "label": "storage", "description": "Owns 65 symbols across 1 file(s)."}}, {"data": {"id": "tls", "label": "tls", "description": "Owns 34 symbols across 4 file(s)."}}], "edges": [{"data": {"id": "edge_0", "source": "src", "target": "cli", "label": "calls"}}, {"data": {"id": "edge_1", "source": "src", "target": "net", "label": "calls"}}, {"data": {"id": "edge_2", "source": "src", "target": "storage", "label": "calls"}}, {"data": {"id": "edge_3", "source": "src", "target": "tls", "label": "calls"}}, {"data": {"id": "edge_4", "source": "cli", "target": "src", "label": "calls"}}, {"data": {"id": "edge_5", "source": "cli", "target": "config", "label": "calls"}}, {"data": {"id": "edge_6", "source": "cli", "target": "discovery", "label": "calls"}}, {"data": {"id": "edge_7", "source": "cli", "target": "identity", "label": "calls"}}, {"data": {"id": "edge_8", "source": "cli", "target": "net", "label": "calls"}}, {"data": {"id": "edge_9", "source": "cli", "target": "replication", "label": "calls"}}, {"data": {"id": "edge_10", "source": "cli", "target": "storage", "label": "calls"}}, {"data": {"id": "edge_11", "source": "cli", "target": "tls", "label": "calls"}}, {"data": {"id": "edge_12", "source": "config", "target": "identity", "label": "calls"}}, {"data": {"id": "edge_13", "source": "net", "target": "replication", "label": "calls"}}, {"data": {"id": "edge_14", "source": "net", "target": "storage", "label": "calls"}}, {"data": {"id": "edge_15", "source": "net", "target": "tls", "label": "calls"}}, {"data": {"id": "edge_16", "source": "replication", "target": "net", "label": "calls"}}, {"data": {"id": "edge_17", "source": "replication", "target": "storage", "label": "calls"}}, {"data": {"id": "edge_18", "source": "storage", "target": "tls", "label": "calls"}}, {"data": {"id": "edge_19", "source": "tls", "target": "identity", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
